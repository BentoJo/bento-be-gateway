# Reference compose for deploying bento-be-gateway on the VPS (/apps/bento-be-gateway).
#
# The image is built + pushed to GHCR by .github/workflows/deploy.yaml.
# On the VPS you only PULL + run it (no source there) — do NOT add `build:`.
#
# This is the NestJS HTTP API gateway. It is a gRPC CLIENT to iam-service /
# ws-service / authz-service (reached over the shared `backend-network`) and it
# uses Redis. It has NO database of its own.
#
# Runtime config lives in a `.env` file NEXT TO this compose on the VPS
# (chmod 600) — docker compose auto-loads it for env_file + ${...} interpolation:
#
#   # /apps/bento-be-gateway/.env
#   PORT=5000
#   JWKS_URL=http://iam-service:5001
#   IAM_GRPC_PORT=50052
#   WORKSPACE_GRPC_PORT=50054
#   AUTHZ_URL=authz-service:50053
#   CORS_ORIGIN=https://app.manejo.io        # comma-separated list; unset => allow all
#   # --- Redis (managed) ---
#   REDIS_HOST=<managed-redis-host>
#   REDIS_PORT=<managed-redis-port>
#   REDIS_PASS=<managed-redis-password>
#
# PORT MAPPING: the container listens on 5000 and is bound to localhost only.
# Put a reverse proxy (nginx/Caddy/Traefik) in front for TLS, forwarding to
# 127.0.0.1:5000. NOTE: the 5050:5000 mapping in the local dev `compose.yaml`
# is a LOCAL-ONLY convenience and is intentionally NOT used here.
#
# REDIS: this reference uses a MANAGED Redis via the .env vars above (matches the
# current setup). If you'd rather run Redis on the box, uncomment the `redis`
# service block below, set REDIS_HOST=redis / REDIS_PORT=6379 in .env, and add
# `depends_on: [redis]` to gateway-service.

services:
  gateway-service:
    image: ghcr.io/bentojo/bento-be-gateway:latest
    container_name: gateway-service
    restart: always
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      # CORS is configurable via env (main.ts reads CORS_ORIGIN, comma-separated).
      - CORS_ORIGIN=${CORS_ORIGIN}
    ports:
      # Behind a reverse proxy: bind to localhost only.
      - "127.0.0.1:5000:5000"
    networks:
      - backend-network

  # --- Optional self-hosted Redis (uncomment to use instead of managed) ---
  # redis:
  #   image: redis:7-alpine
  #   container_name: redis
  #   restart: always
  #   command: ["redis-server", "--appendonly", "yes"]
  #   volumes:
  #     - redis-data:/data
  #   networks:
  #     - backend-network

# volumes:
#   redis-data:

networks:
  # Shared with iam-service / ws-service / authz-service. Create once on the VPS:
  #   docker network create backend-network
  backend-network:
    external: true
