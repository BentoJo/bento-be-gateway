services:
  gateway-service:
    build:
      context: .
      target: runner
    container_name: gateway-service
    restart: always
    env_file:
      - .env
    ports:
      - "5000:5000"
    depends_on:
      - redis
    networks:
      - backend-network

  redis:
    image: redis:latest
    container_name: redis
    restart: always
    env_file:
      - .env
    ports:
      - "16462:6379"
    volumes:
      - redis-data:/data
    networks:
      - backend-network

volumes:
  redis-data:

networks:
  backend-network:
    external: true