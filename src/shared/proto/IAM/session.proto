syntax = "proto3";

package session;

service SessionService {
    rpc CreateSession (CreateSessionRequest) returns (CreateSessionResponse);
    rpc GetSession (GetSessionRequest) returns (GetSessionResponse);
}

// Matches the IAM @GrpcMethod('SessionsService', ...) handlers.
service SessionsService {
    rpc ListSessions (ListSessionsRequest) returns (ListSessionsResponse);
    rpc RevokeSession (RevokeSessionRequest) returns (RevokeSessionResponse);
}

message ListSessionsRequest {
    string userId = 1;
    string currentSessionId = 2;
}

message SessionListItem {
    string id = 1;
    string ipAddress = 2;
    string lastActivity = 3;
    bool isCurrent = 4;
    string createdAt = 5;
}

// IAM returns a bare array; the gRPC client wraps it under a repeated field.
message ListSessionsResponse {
    repeated SessionListItem sessions = 1;
}

message RevokeSessionRequest {
    string sessionId = 1;
    string deivceId = 2;
}

message RevokeSessionResponse {
}

message CreateSessionRequest {
    string user_id = 1;
    string device_id = 2;
}

message CreateSessionResponse {
    string session_id = 1;
    string user_id = 2;
    string device_id = 3;
    int64 created_at = 4;
}

message GetSessionRequest {
    string session_id = 1;
}

message GetSessionResponse {
    string session_id = 1;
    string user_id = 2;
    string device_id = 3;
    int64 created_at = 4;
}
