syntax = "proto3";

package device;

service DeviceService {
    rpc RegisterDevice (RegisterDeviceRequest) returns (RegisterDeviceResponse);
    rpc GetDevice (GetDeviceRequest) returns (GetDeviceResponse);
}

// Matches the IAM @GrpcMethod('DevicesService', ...) handlers.
service DevicesService {
    rpc ListDevices (ListDevicesRequest) returns (ListDevicesResponse);
    rpc RevokeDevice (RevokeDeviceRequest) returns (RevokeDeviceResponse);
    rpc RevokeAllOtherDevices (RevokeAllOtherDevicesRequest) returns (RevokeAllOtherDevicesResponse);
}

message ListDevicesRequest {
    string userId = 1;
    string currentDeviceId = 2;
}

message DeviceListItem {
    string id = 1;
    string deviceFingerprintHash = 2;
    string deviceName = 3;
    string firstSeenAt = 4;
    string lastSeenAt = 5;
    bool isCurrent = 6;
    bool isActive = 7;
    string createdAt = 8;
    string updatedAt = 9;
    string revokedAt = 10;
}

// IAM returns a bare array; the gRPC client wraps it under a repeated field.
message ListDevicesResponse {
    repeated DeviceListItem devices = 1;
}

message RevokeDeviceRequest {
    string userId = 1;
    string deviceId = 2;
    string currentDeviceId = 3;
}

message RevokeDeviceResponse {
}

message RevokeAllOtherDevicesRequest {
    string userId = 1;
}

message RevokeAllOtherDevicesResponse {
}

message RegisterDeviceRequest {
    string user_id = 1;
    string device_name = 2;
    string device_type = 3;
}

message RegisterDeviceResponse {
    string device_id = 1;
    string user_id = 2;
    string device_name = 3;
    string device_type = 4;
    int64 registered_at = 5;
}

message GetDeviceRequest {
    string device_id = 1;
}

message GetDeviceResponse {
    string device_id = 1;
    string user_id = 2;
    string device_name = 3;
    string device_type = 4;
    int64 registered_at = 5;
}
